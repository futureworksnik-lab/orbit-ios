included:
  - Orbit
  - OrbitTests
  - OrbitUITests
excluded:
  - Orbit.xcodeproj

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unused_import
  - closure_spacing
  - trailing_closure
  - vertical_whitespace_closing_braces
